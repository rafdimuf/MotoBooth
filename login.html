<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MotoBooth</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- FavIcon -->
    <link rel="shortcut icon" href="Assets/Frame 12.png" type="image/x-icon">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Responsive Mobile Drawer Navbar -->
    <link rel="stylesheet" href="mobile-menu.css">

    <style>
        :root {
            --primary-font: 'Outfit', sans-serif;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --bg-color: #ffffff;
            --input-border: #cccccc;
            /* Light beige matching the image */
            --link-blue: #6385cd;
            /* Blueish color for 'Login' and 'OR' */
            --fb-blue: #1877F2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--primary-font);
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ----- Header & Navbar ----- */
        .header {
            padding: 0 20px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .navbar {
            width: 100%;
            max-width: 1250px;
            margin-top: 15px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            height: 80px;
            border: 1px solid #e6e6e6;
        }

        .logo {
            display: flex;
            align-items: center;
            margin-left: 0;
            text-decoration: none;
        }

        .logo img {
            width: 150px;
            height: 50px;
            object-fit: contain;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
            align-items: center;
            margin-right: 0;
        }

        .nav-links li a {
            text-decoration: none;
            color: #555;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links li a:hover {
            color: #1a1a1a;
        }

        /* ----- Main Container ----- */
        .main-content {
            display: flex;
            width: 100%;
            max-width: 1200px;
            margin: 20px auto 40px;
            padding: 0 20px;
            gap: 60px;
            flex: 1;
            /* Stretch to fill remaining height */
        }

        /* ----- Left Column: Login Form ----- */
        .login-section {
            flex: 0.9;
            padding-top: 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 10px;
            color: #000;
        }

        .form-group input {
            width: 100%;
            padding: 18px 15px;
            border: 1px solid #bfbfbf;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.02);
        }

        .form-group input:focus {
            border-color: #777;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        /* Custom Checkbox */
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            cursor: pointer;
            user-select: none;
            color: #1a1a1a;
        }

        .checkbox-label input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .checkmark {
            height: 20px;
            width: 20px;
            background-color: transparent;
            border: 2.5px solid #000;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .checkbox-label input:checked~.checkmark {
            background-color: #000;
            border-color: #000;
        }

        .checkmark:after {
            content: "";
            display: none;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-bottom: 3px;
            /* slight adjustment for optical center */
        }

        .checkbox-label input:checked~.checkmark:after {
            display: block;
        }

        .forgot-password {
            color: #1a1a1a;
            text-decoration: underline;
            font-size: 16px;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background-color: transparent;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            color: var(--link-blue);
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 35px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        .login-btn:hover {
            background-color: #fcfcfc;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.06);
        }

        .divider {
            display: flex;
            align-items: center;
            margin-bottom: 35px;
            color: var(--link-blue);
            font-size: 16px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #1a1a1a;
        }

        .divider span {
            padding: 0 20px;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 50px;
        }

        .social-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid #ececec;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            /* Noticeable shadow for social buttons */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
        }

        .social-btn:hover {
            transform: translateY(-2px);
        }


        .social-btn.apple {
            color: #000;
        }

        .social-btn.facebook {
            background-color: var(--fb-blue);
            color: white;
            border: none;
        }

        .register-text {
            text-align: center;
            font-size: 16px;
            color: #1a1a1a;
        }

        .register-text a {
            color: #000;
            font-weight: 700;
            text-decoration: none;
        }

        /* ----- Right Column: Visual Area ----- */
        .visual-section {
            flex: 1.1;
            background-color: var(--visual-bg);
            border-radius: 12px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 600px;
            overflow: hidden;
            padding: 40px;
        }

        .illustration-placeholder {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .collage-image {
            max-width: 100%;
            max-height: 550px;
            height: auto;
            object-fit: contain;
            border-radius: 16px;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            animation: floatIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .collage-image:hover {
            transform: scale(1.02);
        }

        @keyframes floatIn {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* Responsive Breakpoints */
        @media (max-width: 900px) {
            .main-content {
                flex-direction: column;
                margin-top: 0;
            }

            .login-section {
                padding-top: 20px;
                max-width: 500px;
                margin: 0 auto;
                width: 100%;
            }

            .nav-links {
                display: none;
                /* Hide on mobile for simplicity, similar to the landing page */
            }

            .visual-section {
                min-height: auto;
                padding: 30px 20px;
            }

            .collage-image {
                max-height: 420px;
            }
        }
    </style>
</head>

<body>

    <!-- Header Navigation -->
    <header class="header">
        <nav class="navbar">
            <a class="logo" href="motobooth.html">
                <img src="Assets/logoMotoBooth.png" alt="MotoBooth">
            </a>
            <ul class="nav-links">
                <li><a href="motobooth.html#about">About Us</a></li>
                <li><a href="Dashboard.html">Dashboard</a></li>
                <li><a href="payment.html">Package</a></li>
                <li><a href="login.html">Log In</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">

        <!-- Left Side: Login Form -->
        <section class="login-section">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password">
            </div>

            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" checked>
                    <span class="checkmark"></span>
                    Keep me logged in
                </label>
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>

            <button type="button" class="login-btn">Login</button>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="social-buttons">
                <!-- Google Icon -->
                <a href="#" class="social-btn google">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google"
                        width="30">
                </a>

                <!-- Apple Icon -->
                <a href="#" class="social-btn apple">
                    <i class="fa-brands fa-apple"></i>
                </a>

                <!-- Facebook Icon -->
                <a href="#" class="social-btn facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>
            </div>

            <p class="register-text">
                Not Registered Yet? <a href="#">Create an Account</a>
            </p>
        </section>

        <!-- Right Side: Visual/Image Placeholder -->
        <section class="visual-section">
            <!-- Collage Illustration Area with image -->
            <div class="illustration-placeholder">
                <img src="Assets/photoStripLogin.png" alt="MotoBooth Photo Strip Collage" class="collage-image">
            </div>


        </section>

    </main>

    <!-- Supabase JS Library from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // --- KONFIGURASI SUPABASE ---
        const SUPABASE_URL = "https://vpghdgbreksgwnvwlzvj.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwZ2hkZ2JyZWtzZ3dudndsenZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NjAyMzAsImV4cCI6MjA5MzUzNjIzMH0.YFcb4jIQIVYOIWI-2ezPC4G8VsQtKmECU1zssU5tluo";

        // Inisialisasi Supabase Client
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Parse redirect URL parameter if present
        const urlParams = new URLSearchParams(window.location.search);
        const redirectParam = urlParams.get('redirect');

        // Auto-forward if session already exists
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                const targetUrl = redirectParam || 'Dashboard.html';
                window.location.replace(targetUrl);
            }
        });

        // Hubungkan Tombol Google ke OAuth Supabase
        const googleBtn = document.querySelector('.social-btn.google');
        if (googleBtn) {
            googleBtn.addEventListener('click', async (e) => {
                e.preventDefault();

                try {
                    // Resolve final redirect URL for OAuth (must be absolute)
                    const baseRedirect = window.location.href.split('/').slice(0, -1).join('/');
                    const oauthRedirectUrl = redirectParam 
                        ? `${baseRedirect}/${redirectParam}` 
                        : `${baseRedirect}/Dashboard.html`;

                    // Lakukan sign-in dengan OAuth Google
                    const { error } = await supabaseClient.auth.signInWithOAuth({
                        provider: 'google',
                        options: {
                            redirectTo: oauthRedirectUrl
                        }
                    });
                    if (error) throw error;
                } catch (err) {
                    console.error("Gagal melakukan login Google:", err.message);
                    alert("Login Gagal: " + err.message);
                }
            });
        }

        // Hubungkan Tombol Login Form untuk Autentikasi Email & Password
        const loginBtn = document.querySelector('.login-btn');
        if (loginBtn) {
            loginBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                const emailInput = document.getElementById('email').value.trim();
                const passwordInput = document.getElementById('password').value;

                if (!emailInput || !passwordInput) {
                    alert("Silakan masukkan email dan password!");
                    return;
                }

                try {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: emailInput,
                        password: passwordInput
                    });
                    if (error) throw error;

                    // Redirect setelah login sukses
                    const targetUrl = redirectParam || 'Dashboard.html';
                    window.location.replace(targetUrl);
                } catch (err) {
                    console.error("Gagal login email:", err.message);
                    alert("Login Gagal: " + err.message);
                }
            });
        }
    </script>
    <!-- Shared Supabase Auth state synchronizer -->
    <script src="auth.js"></script>
    <!-- Mobile Menu Drawer Support -->
    <script src="mobile-menu.js"></script>
</body>

</html>
