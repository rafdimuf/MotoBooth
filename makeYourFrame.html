<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIY Frame - MotoBooth</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Responsive Mobile Drawer Navbar -->
    <link rel="stylesheet" href="mobile-menu.css">
    <link rel="shortcut icon" href="/Assets/Frame 12.png" type="image/x-icon">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            color: #1a1a1a;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar-custom {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            border: 1px solid #e6e6e6;
            margin-top: 15px;
            padding: 0 30px !important;
            height: 80px;
            display: flex;
            align-items: center;
            background-color: white !important;
        }

        .navbar-brand img {
            width: 150px;
            height: 50px;
            object-fit: contain;
        }

        .nav-link {
            font-weight: 500;
            color: #555 !important;
            margin-left: 20px;
            font-size: 15px;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #1a1a1a !important;
        }

        /* Side Panels */
        .panel-card {
            border: 1px solid #666;
            border-radius: 12px;
            padding: 25px 20px;
            background-color: #fff;
            min-height: 450px;
            box-shadow: none;
        }

        .panel-title {
            font-weight: 800;
            font-size: 16px;
            text-align: center;
            margin-bottom: 25px;
        }

        .edit-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background-color: white;
            border: 1px solid #888;
            border-radius: 4px;
            font-weight: 500;
            color: #333;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s;
        }

        .edit-btn:hover {
            background-color: #f8f9fa;
        }

        .edit-btn.active {
            background-color: #eabda1;
            color: #333;
            border-color: #888;
        }

        /* Accessories placeholder grid */
        .accessories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            justify-items: center;
        }

        .accessory-item {
            width: 100%;
            aspect-ratio: 1;
            background-color: #f8f9fa;
            border: 1px dashed #ccc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #aaa;
            cursor: pointer;
            transition: all 0.2s;
        }

        .accessory-item:hover {
            background-color: #f0f0f0;
            border-color: #888;
            color: #555;
            transform: scale(1.05);
        }

        /* Main Workspace */
        .main-workspace {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 450px;
        }

        .canvas-area {
            width: 280px;
            height: 590px;
            border: 2px dashed #ddd;
            background-color: #fafafa;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 35px;
            padding-left: 32.5px;
            padding-right: 32.5px;
            padding-bottom: 87px;
            gap: 22.4px;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            transition: background-color 0.3s;
            box-sizing: border-box;
        }

        .photo-slot {
            width: 215px;
            height: 141px;
            background-color: #e0e0e0;
            border: 2px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .colors-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            justify-items: center;
        }

        .color-item {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
        }

        .color-item:hover {
            transform: scale(1.05);
            border-color: #888;
        }

        .dragged-accessory {
            position: absolute;
            cursor: move;
            font-size: 30px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            user-select: none;
            box-sizing: border-box;
        }

        .dragged-accessory * {
            pointer-events: none;
        }

        /* Confirm Button */
        .btn-confirm {
            background-color: #3edb66;
            color: white;
            font-weight: 700;
            font-size: 16px;
            padding: 10px 45px;
            border-radius: 30px;
            border: none;
            box-shadow: 0 4px 6px rgba(62, 219, 102, 0.2);
            transition: all 0.2s;
        }

        .btn-confirm:hover {
            background-color: #35c45b;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(62, 219, 102, 0.3);
        }

        .btn-confirm:active {
            transform: translateY(1px);
            box-shadow: 0 2px 4px rgba(62, 219, 102, 0.2);
        }

        .bottom-action {
            margin-top: 40px;
            margin-bottom: 50px;
            text-align: center;
        }

        .profile-container {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 20px;
            color: #1a1a1a;
        }

        .profile-container i {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container flex-grow-1 d-flex flex-column">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg bg-white navbar-custom">
            <div class="container-fluid">
                <a class="navbar-brand" href="motobooth.html">
                    <img src="Assets/logoMotoBooth.png" alt="MotoBooth">
                </a>
                <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav align-items-center">
                        <li class="nav-item"><a class="nav-link" href="motobooth.html#about">About Us</a></li>
                        <li class="nav-item"><a class="nav-link" href="Dashboard.html">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="payment.html">Package</a></li>
                        <li class="nav-item"><a class="nav-link" href="login.html">Log In</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <div class="row mt-5 pt-3 flex-grow-1 align-items-center">
            <!-- Left Sidebar -->
            <div class="col-md-3 mb-4 mb-md-0">
                <div class="panel-card">
                    <h5 class="panel-title">Edit Your Frame</h5>

                    <button class="edit-btn" id="frame-btn" onclick="selectEditTab('frame')">Frame</button>
                    <button class="edit-btn" id="color-btn" onclick="selectEditTab('color')">Color</button>
                    <button class="edit-btn active" id="accessories-btn"
                        onclick="selectEditTab('accessories')">Accessories</button>
                    <button class="edit-btn" id="your-frame-btn" onclick="selectEditTab('your-frame')">Your
                        Frame</button>
                </div>
            </div>

            <!-- Center Workspace (Canvas) -->
            <div class="col-md-6 main-workspace mb-4 mb-md-0">
                <div class="canvas-area" id="canvas-area" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <div class="photo-slot"></div>
                    <div class="photo-slot"></div>
                    <div class="photo-slot"></div>
                </div>
            </div>

            <!-- Right Sidebar -->
            <div class="col-md-3">
                <div class="panel-card" id="accessories-panel">
                    <h5 class="panel-title">Accessories</h5>

                    <div class="accessories-grid">
                        <div class="accessory-item" id="acc-spray" title="Spray" draggable="true"
                            ondragstart="drag(event)"><i class="fa-solid fa-spray-can text-primary"></i></div>
                        <div class="accessory-item" id="acc-donut" title="Donut" draggable="true"
                            ondragstart="drag(event)"><i class="fa-solid fa-cookie-bite text-warning"></i></div>
                        <div class="accessory-item" id="acc-sun" title="Sun" draggable="true" ondragstart="drag(event)">
                            <i class="fa-solid fa-sun text-warning"></i>
                        </div>
                        <div class="accessory-item" id="acc-coffee" title="Coffee" draggable="true"
                            ondragstart="drag(event)"><i class="fa-solid fa-mug-hot text-danger"></i></div>
                        <div class="accessory-item" id="acc-heart" title="Heart" draggable="true"
                            ondragstart="drag(event)"><i class="fa-solid fa-heart text-danger"></i></div>
                        <div class="accessory-item" id="acc-star" title="Star" draggable="true"
                            ondragstart="drag(event)"><i class="fa-solid fa-star text-info"></i></div>
                        <div class="accessory-item" id="acc-camera" title="Camera" draggable="true"
                            ondragstart="drag(event)"><i class="fa-solid fa-camera text-secondary"></i></div>
                        <div class="accessory-item" id="acc-crown" title="Crown" draggable="true"
                            ondragstart="drag(event)"><i class="fa-solid fa-crown text-warning"></i></div>
                    </div>
                </div>

                <div class="panel-card" id="color-panel" style="display: none;">
                    <h5 class="panel-title">Colors</h5>
                    <div class="colors-grid">
                        <div class="color-item" style="background-color: #FFF9D2;"
                            onclick="changeCanvasColor('#FFF9D2')"></div>
                        <div class="color-item" style="background-color: #FFEBCC;"
                            onclick="changeCanvasColor('#FFEBCC')"></div>
                        <div class="color-item" style="background-color: #BFDDF0;"
                            onclick="changeCanvasColor('#BFDDF0')"></div>
                        <div class="color-item" style="background-color: #8CC0EB;"
                            onclick="changeCanvasColor('#8CC0EB')"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Confirm Button -->
        <div class="bottom-action">
            <button class="btn btn-confirm" onclick="saveFrameConfig()">Confirm</button>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let accessoryCounter = 0;

        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev) {
            ev.dataTransfer.setData("text/plain", ev.currentTarget.id);
            if (ev.currentTarget.classList.contains("dragged-accessory")) {
                const rect = ev.currentTarget.getBoundingClientRect();
                const offsetX = ev.clientX - rect.left;
                const offsetY = ev.clientY - rect.top;
                ev.dataTransfer.setData("offsetX", offsetX);
                ev.dataTransfer.setData("offsetY", offsetY);
            }
        }

        function drop(ev) {
            ev.preventDefault();
            var dataId = ev.dataTransfer.getData("text/plain");
            var sourceEl = document.getElementById(dataId);

            if (!sourceEl) return;

            const canvas = document.getElementById("canvas-area");
            const rect = canvas.getBoundingClientRect();

            const x = ev.clientX - rect.left;
            const y = ev.clientY - rect.top;

            let offsetX = 15; // default center offset (half of 30px width/height)
            let offsetY = 15;

            const storedOffsetX = ev.dataTransfer.getData("offsetX");
            const storedOffsetY = ev.dataTransfer.getData("offsetY");

            if (storedOffsetX && storedOffsetY) {
                offsetX = parseFloat(storedOffsetX);
                offsetY = parseFloat(storedOffsetY);
            }

            if (sourceEl.classList.contains("accessory-item")) {
                const newEl = document.createElement('div');
                newEl.className = 'dragged-accessory';
                newEl.innerHTML = sourceEl.innerHTML;

                newEl.style.left = (x - offsetX) + 'px';
                newEl.style.top = (y - offsetY) + 'px';

                newEl.draggable = true;
                newEl.id = 'dropped-acc-' + accessoryCounter++;
                newEl.ondragstart = drag;

                // Double click to remove accessory
                newEl.ondblclick = function () { this.remove(); };

                canvas.appendChild(newEl);
            } else if (sourceEl.classList.contains("dragged-accessory")) {
                sourceEl.style.left = (x - offsetX) + 'px';
                sourceEl.style.top = (y - offsetY) + 'px';
            }
        }

        function selectEditTab(tabName) {
            document.querySelectorAll('.edit-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById('accessories-panel').style.display = 'none';
            document.getElementById('color-panel').style.display = 'none';

            if (tabName === 'color') {
                document.getElementById('color-btn').classList.add('active');
                document.getElementById('color-panel').style.display = 'block';
            } else if (tabName === 'accessories') {
                document.getElementById('accessories-btn').classList.add('active');
                document.getElementById('accessories-panel').style.display = 'block';
            } else if (tabName === 'frame') {
                document.getElementById('frame-btn').classList.add('active');
            } else if (tabName === 'your-frame') {
                document.getElementById('your-frame-btn').classList.add('active');
            }
        }

        function changeCanvasColor(color) {
            document.getElementById('canvas-area').style.backgroundColor = color;
        }

        async function saveFrameConfig() {
            const canvas = document.getElementById('canvas-area');
            const bgColor = canvas.style.backgroundColor || '#fafafa';

            const accessories = [];

            // Map icon classes to their unicode for canvas rendering later
            const iconUnicodeMap = {
                'fa-spray-can': '\uf5bd',
                'fa-cookie-bite': '\uf564',
                'fa-sun': '\uf185',
                'fa-mug-hot': '\uf7b6',
                'fa-heart': '\uf004',
                'fa-star': '\uf005',
                'fa-camera': '\uf030',
                'fa-crown': '\uf521'
            };

            document.querySelectorAll('.dragged-accessory').forEach(el => {
                const rect = el.getBoundingClientRect();
                const parentRect = canvas.getBoundingClientRect();

                // Store relative percentage position so it scales to any canvas size
                const leftPercent = (rect.left - parentRect.left) / parentRect.width;
                const topPercent = (rect.top - parentRect.top) / parentRect.height;

                const iconElement = el.querySelector('i');
                const iconClassList = iconElement ? Array.from(iconElement.classList) : [];

                let unicode = '';
                let color = '#000';

                if (iconElement) {
                    const computedStyle = window.getComputedStyle(iconElement);
                    color = computedStyle.color;

                    // Find the main fa-* class
                    const mainClass = iconClassList.find(c => c.startsWith('fa-') && c !== 'fa-solid' && c !== 'fa-regular');
                    if (mainClass && iconUnicodeMap[mainClass]) {
                        unicode = iconUnicodeMap[mainClass];
                    }
                }

                accessories.push({
                    leftPercent: leftPercent,
                    topPercent: topPercent,
                    html: el.innerHTML,
                    unicode: unicode,
                    color: color,
                    fontFamily: '"Font Awesome 6 Free"'
                });
            });

            const frameConfig = {
                backgroundColor: bgColor,
                accessories: accessories
            };

            localStorage.setItem('motobooth_frame_config', JSON.stringify(frameConfig));
            localStorage.setItem('selected_frame_type', 'diy');

            // Save to Frameku if logged in & has premium active subscription
            const SUPABASE_URL = "https://vpghdgbreksgwnvwlzvj.supabase.co"; 
            const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwZ2hkZ2JyZWtzZ3dudndsenZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NjAyMzAsImV4cCI6MjA5MzUzNjIzMH0.YFcb4jIQIVYOIWI-2ezPC4G8VsQtKmECU1zssU5tluo";
            
            if (window.supabase) {
                try {
                    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (session && session.user) {
                        const userId = session.user.id;
                        
                        // Check active subscription status
                        const paymentsKey = `payments_${userId}`;
                        const payments = JSON.parse(localStorage.getItem(paymentsKey)) || [];
                        let isPremium = false;
                        
                        payments.forEach(p => {
                            if (p.status === 'success') {
                                const pTime = new Date(p.date).getTime();
                                let duration = 0;
                                if (p.gross_amount === 8000) duration = 5;
                                else if (p.gross_amount === 30000) duration = 30;
                                else if (p.gross_amount === 38000) duration = 35;
                                if (pTime + (duration * 24 * 60 * 60 * 1000) > Date.now()) {
                                    isPremium = true;
                                }
                            }
                        });

                        if (isPremium) {
                            const storageKey = `frames_${userId}`;
                            let frames = JSON.parse(localStorage.getItem(storageKey)) || [];
                            frames.unshift({
                                id: `diy_${Date.now()}`,
                                type: 'diy',
                                config: frameConfig,
                                date: new Date().toISOString()
                            });
                            localStorage.setItem(storageKey, JSON.stringify(frames));
                            console.log('[Frameku] DIY Frame saved to active premium gallery');
                        }
                    }
                } catch (e) {
                    console.error('Error saving DIY frame to Frameku:', e);
                }
            }

            window.location.href = 'photoPage.html';
        }
    </script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Shared Supabase Auth state synchronizer -->
    <script src="auth.js"></script>
    <!-- Mobile Menu Drawer Support -->
    <script src="mobile-menu.js"></script>
</body>

</html>
