<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoBooth - Choose Template Frame</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="shortcut icon" href="Assets/logoMotoBooth.png" type="image/x-icon">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            color: #1a1a1a;
            background-color: #fcfcfc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar-custom {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            border: 1px solid #e6e6e6;
            margin-top: 15px;
            padding: 10px 30px;
        }

        .navbar-brand img {
            width: 150px;
        }

        .nav-link {
            font-weight: 500;
            color: #555 !important;
            margin-left: 20px;
            font-size: 15px;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #1a1a1a !important;
        }

        /* Icon Profile */
        .profile-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #1a1a1a;
            margin-left: 20px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .profile-icon:hover {
            background-color: #1a1a1a;
            color: white;
        }

        /* Frame Options Grid */
        .frame-container {
            flex-grow: 1;
            padding: 50px 0;
        }

        .frame-card {
            --frame-scale: 0.26; /* Skala preview di halaman pemilihan template */
            background: white;
            border: 1px solid #777;
            width: calc(800px * var(--frame-scale));
            height: calc(1686px * var(--frame-scale));
            padding-left: calc(93px * var(--frame-scale));
            padding-right: calc(93px * var(--frame-scale));
            padding-top: calc(100px * var(--frame-scale));
            padding-bottom: 0;
            display: flex;
            flex-direction: column;
            gap: calc(64px * var(--frame-scale));
            margin: 0 auto;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            box-sizing: border-box;
        }

        /* Kotak untuk tempat foto di dalam frame */
        .photo-block {
            width: 100%;
            height: calc(403px * var(--frame-scale));
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 12px;
            overflow: hidden;
            border-radius: 2px;
            position: relative;
            z-index: 6;
            box-sizing: border-box;
        }

        /* Space kosong di bawah frame ala photostrip */
        .frame-bottom {
            height: calc(249px * var(--frame-scale));
        }

        /* Hover & Active/Selected states dengan Animasi */
        .frame-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            border-color: #555;
        }

        /* Animasi Pop-out ketika Frame Dipilih */
        .frame-card.active {
            border-color: #42567a;
            border-width: 3px;
            transform: scale(1.08) translateY(-5px);
            /* Membesar & sedikit naik */
            box-shadow: 0 15px 35px rgba(66, 86, 122, 0.25);
            z-index: 10;
        }

        /* Animasi Badge Centang */
        .check-badge {
            position: absolute;
            top: -18px;
            right: -18px;
            background-color: #42567a;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            opacity: 0;
            transform: scale(0) rotate(-45deg);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 15;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .frame-card.active .check-badge {
            opacity: 1;
            transform: scale(1) rotate(0);
        }

        /* Buttons */
        .action-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 60px;
        }

        .btn-kembali {
            background-color: #f8f9fa;
            color: #1a1a1a;
            font-weight: 600;
            padding: 12px 45px;
            border-radius: 6px;
            border: 1px solid #ccc;
            transition: all 0.2s;
            font-size: 15px;
        }

        .btn-kembali:hover {
            background-color: #e9ecef;
            transform: translateY(-2px);
        }

        .btn-lanjut {
            background-color: #3ddc68;
            /* Warna Hijau Terang */
            color: white;
            font-weight: 600;
            padding: 12px 65px;
            border-radius: 6px;
            border: none;
            transition: all 0.2s;
            font-size: 15px;
        }

        .btn-lanjut:hover {
            background-color: #34c45b;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg bg-white navbar-custom">
            <div class="container-fluid">
                <a class="navbar-brand" href="motobooth.html">
                    <img src="Assets/logoMotoBooth.png" alt="MotoBooth" style="max-height:50px; object-fit: contain;">
                </a>
                <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav align-items-center">
                        <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">About Us</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Package</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Dashboard</a></li>
                        <li class="nav-item">
                            <a href="#" class="profile-icon">
                                <i class="fa-solid fa-user"></i>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>

    <!-- Main Content: Template Selection Grid -->
    <div class="container frame-container">
        <!-- Row 1: 4 Templates -->
        <div class="row w-100 justify-content-center g-4">
            
            <!-- Template 1: Perkoro koe -->
            <div class="col-md-3 d-flex flex-column align-items-center mb-4">
                <div class="frame-card" onclick="selectFrame(this, 'template_1')">
                    <div class="check-badge"><i class="fa-solid fa-check"></i></div>
                    
                    <!-- Frame Overlay -->
                    <img src="Frame/Frame1.png" alt="Perkoro koe Frame" class="position-absolute top-0 start-0 w-100 h-100" style="object-fit: fill; z-index: 5; pointer-events: none; border-radius: inherit;">

                    <div class="photo-block">[Photo]</div>
                    <div class="photo-block">[Photo]</div>
                    <div class="photo-block">[Photo]</div>
                    <div class="frame-bottom"></div>
                </div>
                <div class="mt-3 text-center fw-bold text-muted fs-5">Perkoro koe</div>
            </div>

            <!-- Template 2: Opo ono ne -->
            <div class="col-md-3 d-flex flex-column align-items-center mb-4">
                <div class="frame-card" onclick="selectFrame(this, 'template_2')">
                    <div class="check-badge"><i class="fa-solid fa-check"></i></div>
                    
                    <!-- Frame Overlay -->
                    <img src="Frame/Frame2.png" alt="Opo ono ne Frame" class="position-absolute top-0 start-0 w-100 h-100" style="object-fit: fill; z-index: 5; pointer-events: none; border-radius: inherit;">

                    <div class="photo-block">[Photo]</div>
                    <div class="photo-block">[Photo]</div>
                    <div class="photo-block">[Photo]</div>
                    <div class="frame-bottom"></div>
                </div>
                <div class="mt-3 text-center fw-bold text-muted fs-5">Opo ono ne</div>
            </div>

            <!-- Template 3: Demit -->
            <div class="col-md-3 d-flex flex-column align-items-center mb-4">
                <div class="frame-card" onclick="selectFrame(this, 'template_3')">
                    <div class="check-badge"><i class="fa-solid fa-check"></i></div>
                    
                    <!-- Frame Overlay -->
                    <img src="Frame/Frame3.png" alt="Demit Frame" class="position-absolute top-0 start-0 w-100 h-100" style="object-fit: fill; z-index: 5; pointer-events: none; border-radius: inherit;">

                    <div class="photo-block">[Photo]</div>
                    <div class="photo-block">[Photo]</div>
                    <div class="photo-block">[Photo]</div>
                    <div class="frame-bottom"></div>
                </div>
                <div class="mt-3 text-center fw-bold text-muted fs-5">Demit</div>
            </div>

            <!-- Template 4: Teu ngarasa -->
            <div class="col-md-3 d-flex flex-column align-items-center mb-4">
                <div class="frame-card" onclick="selectFrame(this, 'template_4')">
                    <div class="check-badge"><i class="fa-solid fa-check"></i></div>
                    
                    <!-- Frame Overlay -->
                    <img src="Frame/Frame4.png" alt="Teu ngarasa Frame" class="position-absolute top-0 start-0 w-100 h-100" style="object-fit: fill; z-index: 5; pointer-events: none; border-radius: inherit;">

                    <div class="photo-block">[Photo]</div>
                    <div class="photo-block">[Photo]</div>
                    <div class="photo-block">[Photo]</div>
                    <div class="frame-bottom"></div>
                </div>
                <div class="mt-3 text-center fw-bold text-muted fs-5">Teu ngarasa</div>
            </div>

        </div>

        <!-- Row 2: 1 Template (Kabeh tentang mu) -->
        <div class="row w-100 justify-content-center g-4 mt-2">
            
            <!-- Template 5: Kabeh tentang mu -->
            <div class="col-md-3 d-flex flex-column align-items-center">
                <div class="frame-card" onclick="selectFrame(this, 'template_5')">
                    <div class="check-badge"><i class="fa-solid fa-check"></i></div>
                    
                    <!-- Frame Overlay -->
                    <img src="Frame/Frame5.png" alt="Kabeh tentang mu Frame" class="position-absolute top-0 start-0 w-100 h-100" style="object-fit: fill; z-index: 5; pointer-events: none; border-radius: inherit;">

                    <div class="photo-block">[Photo]</div>
                    <div class="photo-block">[Photo]</div>
                    <div class="photo-block">[Photo]</div>
                    <div class="frame-bottom"></div>
                </div>
                <div class="mt-3 text-center fw-bold text-muted fs-5">Kabeh tentang mu</div>
            </div>

        </div>
    </div>

    <!-- Bottom Actions -->
    <div class="container action-buttons">
        <a href="chooseFrame.html" class="text-decoration-none"><button class="btn-kembali">Kembali</button></a>
        <button class="btn-lanjut" id="btnLanjut">Lanjut</button>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Selection Logic Script -->
    <script>
        let chosenFrame = '';

        function selectFrame(selectedElement, frameType) {
            // Hapus kelas 'active' dari semua frame terlebih dahulu
            const frames = document.querySelectorAll('.frame-card');
            frames.forEach(frame => {
                frame.classList.remove('active');
            });

            // Tambahkan kelas 'active' hanya ke frame yang baru saja diklik
            selectedElement.classList.add('active');
            chosenFrame = frameType;
        }

        // Cek apakah ada frame yang dipilih sebelum lanjut
        document.getElementById('btnLanjut').addEventListener('click', function () {
            const selected = document.querySelector('.frame-card.active');
            if (selected && chosenFrame) {
                // Simpan ke localStorage
                localStorage.setItem('selected_frame_type', chosenFrame);
                // Lanjut ke halaman selanjutnya (photoPage.html)
                window.location.href = 'photoPage.html';
            } else {
                alert('Silakan pilih salah satu template frame terlebih dahulu!');
            }
        });
    </script>
</body>

</html>
