<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Pembayaran - MotoBooth</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Responsive Mobile Drawer Navbar -->
    <link rel="stylesheet" href="mobile-menu.css">
    <link rel="shortcut icon" href="/Assets/Frame 12.png" type="image/x-icon">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            color: #1a1a1a;
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar-custom {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            border: 1px solid #e6e6e6;
            margin-top: 15px;
            padding: 15px 30px;
            background-color: white;
        }

        .navbar-brand {
            font-weight: 800;
            color: #42567a !important;
            font-size: 26px;
        }

        .nav-link {
            font-weight: 500;
            color: #555 !important;
            margin-left: 20px;
            font-size: 15px;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #1a1a1a !important;
        }

        /* Premium State Cards */
        .status-container {
            max-width: 580px;
            margin: 60px auto 80px;
            width: 100%;
        }

        .status-card {
            background: #ffffff;
            border-radius: 24px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.02);
            padding: 45px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Glow effects for premium feel */
        .status-card::before {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            top: -75px;
            left: 50%;
            transform: translateX(-50%);
            filter: blur(50px);
            z-index: 0;
            pointer-events: none;
        }

        .status-card.success::before {
            background: rgba(60, 165, 92, 0.15);
        }

        .status-card.pending::before {
            background: rgba(245, 158, 11, 0.15);
        }

        .status-card.error::before {
            background: rgba(239, 68, 68, 0.15);
        }

        /* Success tick animation */
        .icon-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            z-index: 1;
        }

        .success .icon-wrapper {
            background-color: rgba(60, 165, 92, 0.08);
            border: 2px solid rgba(60, 165, 92, 0.15);
            color: #3ca55c;
        }

        .pending .icon-wrapper {
            background-color: rgba(245, 158, 11, 0.08);
            border: 2px solid rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }

        .error .icon-wrapper {
            background-color: rgba(239, 68, 68, 0.08);
            border: 2px solid rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .icon-wrapper i {
            font-size: 42px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        h1 {
            font-weight: 800;
            font-size: 28px;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            z-index: 1;
            position: relative;
        }

        .success h1 { color: #2d8146; }
        .pending h1 { color: #d97706; }
        .error h1 { color: #dc2626; }

        .lead-text {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 35px;
            z-index: 1;
            position: relative;
        }

        /* Order Info Box */
        .info-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 40px;
            text-align: left;
            z-index: 1;
            position: relative;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed #e2e8f0;
            font-size: 14px;
        }

        .info-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .info-row:first-child {
            padding-top: 0;
        }

        .info-label {
            color: #64748b;
            font-weight: 500;
        }

        .info-value {
            color: #1e293b;
            font-weight: 700;
        }

        .payment-badge {
            background: #e2e8f0;
            color: #475569;
            padding: 4px 10px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Navigation Buttons */
        .btn-action {
            font-weight: 700;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(60, 165, 92, 0.2);
            width: 100%;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .success .btn-action {
            background-color: #3ca55c;
            color: white;
        }

        .success .btn-action:hover {
            background-color: #2d8146;
            transform: translateY(-2px);
        }

        .pending .btn-action {
            background-color: #f59e0b;
            color: white;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.2);
        }

        .pending .btn-action:hover {
            background-color: #d97706;
            transform: translateY(-2px);
        }

        .error .btn-action {
            background-color: #ef4444;
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.2);
        }

        .error .btn-action:hover {
            background-color: #dc2626;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: #64748b;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 14px 32px;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-outline:hover {
            background: #f1f5f9;
            color: #1e293b;
            border-color: #94a3b8;
        }

        /* Animations */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .status-illustration {
            width: 100%;
            max-width: 180px;
            height: auto;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container pb-5">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-custom">
            <div class="container-fluid">
                <a class="navbar-brand" href="motobooth.html">MotoBooth</a>
                <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav align-items-center">
                        <li class="nav-item"><a class="nav-link" href="motobooth.html#about">About Us</a></li>
                        <li class="nav-item"><a class="nav-link" href="Dashboard.html">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="payment.html">Package</a></li>
                        <li class="nav-item"><a class="nav-link" href="login.html">Log In</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Status Card Container -->
        <div class="status-container" id="statusContainer">
            <!-- Loading State by Default -->
            <div class="status-card shadow" style="padding: 60px 40px;">
                <div class="spinner-border text-success" role="status" style="width: 3rem; height: 3rem; margin-bottom: 25px;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <h3 class="fw-bold">Memverifikasi Status Transaksi</h3>
                <p class="text-secondary mb-0">Mohon tunggu sebentar, kami sedang mengambil detail pembayaran Anda dari server...</p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Helper to format currency
        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(number);
        };

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const status = urlParams.get('status');
            const orderId = urlParams.get('order_id') || 'MB-UNKNOWN';
            const grossAmount = parseInt(urlParams.get('gross_amount')) || 0;
            const rawPaymentType = urlParams.get('payment_type') || 'Unknown';
            
            // Format payment type nicely
            const paymentType = rawPaymentType.replace(/_/g, ' ').toUpperCase();

            // Save transaction to localStorage for Dashboard history
            const saveTransaction = async () => {
                if (!status || orderId === 'MB-UNKNOWN') return;
                
                const SUPABASE_URL = "https://vpghdgbreksgwnvwlzvj.supabase.co"; 
                const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwZ2hkZ2JyZWtzZ3dudndsenZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NjAyMzAsImV4cCI6MjA5MzUzNjIzMH0.YFcb4jIQIVYOIWI-2ezPC4G8VsQtKmECU1zssU5tluo";
                
                let supabaseClient;
                if (window.supabase) {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                } else {
                    return;
                }

                try {
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (session && session.user) {
                        const userId = session.user.id;
                        const storageKey = `payments_${userId}`;
                        
                        let payments = JSON.parse(localStorage.getItem(storageKey)) || [];
                        let hasChanges = false;
                        
                        // Check if transaction already exists locally to avoid duplicates on refresh
                        const exists = payments.some(p => p.order_id === orderId);
                        if (!exists) {
                            payments.unshift({
                                order_id: orderId,
                                gross_amount: grossAmount,
                                payment_type: paymentType,
                                status: status,
                                date: new Date().toISOString()
                            });
                            localStorage.setItem(storageKey, JSON.stringify(payments));
                            hasChanges = true;
                            console.log('[Dashboard History] Saved payment locally:', orderId);
                        }

                        // Pull remote payments from Supabase user_metadata to merge
                        const userMetadata = session.user.user_metadata || {};
                        let remotePayments = userMetadata.payments || [];
                        let remoteModified = false;

                        // Merge remote payments into our local list
                        remotePayments.forEach(rp => {
                            if (!payments.some(lp => lp.order_id === rp.order_id)) {
                                payments.push(rp);
                                hasChanges = true;
                            }
                        });

                        // Ensure remote has the new payment too
                        if (!remotePayments.some(rp => rp.order_id === orderId)) {
                            remotePayments.unshift({
                                order_id: orderId,
                                gross_amount: grossAmount,
                                payment_type: paymentType,
                                status: status,
                                date: new Date().toISOString()
                            });
                            remoteModified = true;
                        }

                        // If local list changed, sort and save
                        if (hasChanges) {
                            payments.sort((a, b) => new Date(b.date) - new Date(a.date));
                            localStorage.setItem(storageKey, JSON.stringify(payments));
                        }

                        // If remote list changed, sort and save back to Supabase metadata
                        if (remoteModified || hasChanges) {
                            remotePayments.sort((a, b) => new Date(b.date) - new Date(a.date));
                            await supabaseClient.auth.updateUser({
                                data: { payments: remotePayments }
                            });
                            console.log('[Supabase Sync] Successfully synchronized payment to user_metadata cloud');
                        }
                    }
                } catch (e) {
                    console.error('Error saving transaction to history:', e);
                }
            };
            
            if (window.supabase) {
                saveTransaction();
            } else {
                setTimeout(saveTransaction, 1000);
            }

            const container = document.getElementById('statusContainer');

            // Render view based on payment status
            if (status === 'success') {
                container.innerHTML = `
                    <div class="status-card success shadow">
                        <div class="icon-wrapper">
                            <i class="fa-solid fa-circle-check"></i>
                        </div>
                        <h1>Pembayaran Berhasil!</h1>
                        <p class="lead-text">Terima kasih! Pembayaran Anda telah terkonfirmasi secara instan. Paket langganan premium MotoBooth Anda telah aktif sekarang.</p>
                        
                        <div class="info-box">
                            <div class="info-row">
                                <span class="info-label">Order ID</span>
                                <span class="info-value text-monospace">${orderId}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Total Pembayaran</span>
                                <span class="info-value text-success">${formatRupiah(grossAmount)}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Metode Pembayaran</span>
                                <span class="info-value"><span class="payment-badge">${paymentType}</span></span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Status Transaksi</span>
                                <span class="info-value text-success">Lunas</span>
                            </div>
                        </div>

                        <div class="row g-3">
                            <div class="col-sm-6">
                                <a href="Dashboard.html" class="btn-action">
                                    <i class="fa-solid fa-house"></i> Ke Dashboard
                                </a>
                            </div>
                            <div class="col-sm-6">
                                <a href="chooseFrame.html" class="btn-outline">
                                    <i class="fa-solid fa-wand-magic-sparkles"></i> Pilih Frame Foto
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            } else if (status === 'pending') {
                container.innerHTML = `
                    <div class="status-card pending shadow">
                        <div class="icon-wrapper">
                            <i class="fa-solid fa-clock-rotate-left"></i>
                        </div>
                        <h1>Menunggu Pembayaran</h1>
                        <p class="lead-text">Transaksi Anda berhasil dibuat. Silakan selesaikan pembayaran sesuai petunjuk yang diberikan pada layar Midtrans tadi.</p>
                        
                        <div class="info-box">
                            <div class="info-row">
                                <span class="info-label">Order ID</span>
                                <span class="info-value text-monospace">${orderId}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Total Tagihan</span>
                                <span class="info-value text-warning">${formatRupiah(grossAmount)}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Metode Pembayaran</span>
                                <span class="info-value"><span class="payment-badge">${paymentType}</span></span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Status Pembayaran</span>
                                <span class="info-value text-warning">Menunggu</span>
                            </div>
                        </div>

                        <p class="text-secondary small mb-4" style="line-height: 1.5;">
                            <i class="fa-solid fa-circle-info me-1"></i> Sistem kami akan secara otomatis mengaktifkan keanggotaan Premium Anda setelah pembayaran diselesaikan.
                        </p>

                        <div class="row g-3">
                            <div class="col-sm-6">
                                <a href="Dashboard.html" class="btn-action">
                                    <i class="fa-solid fa-circle-check"></i> Cek Dashboard
                                </a>
                            </div>
                            <div class="col-sm-6">
                                <a href="payment.html" class="btn-outline">
                                    <i class="fa-solid fa-arrow-left"></i> Kembali ke Paket
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                // Error / Canceled Fallback State
                container.innerHTML = `
                    <div class="status-card error shadow">
                        <div class="icon-wrapper">
                            <i class="fa-solid fa-circle-xmark"></i>
                        </div>
                        <h1>Pembayaran Batal / Gagal</h1>
                        <p class="lead-text">Kami tidak dapat memverifikasi status pembayaran Anda, atau Anda telah menutup gerbang pembayaran sebelum menyelesaikan checkout.</p>
                        
                        <div class="info-box">
                            <div class="info-row">
                                <span class="info-label">Order ID</span>
                                <span class="info-value text-monospace">${orderId}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Status</span>
                                <span class="info-value text-danger">Gagal / Dibatalkan</span>
                            </div>
                        </div>

                        <div class="row g-3">
                            <div class="col-sm-6">
                                <a href="payment.html" class="btn-action">
                                    <i class="fa-solid fa-arrow-rotate-left"></i> Coba Paket Lagi
                                </a>
                            </div>
                            <div class="col-sm-6">
                                <a href="Dashboard.html" class="btn-outline">
                                    <i class="fa-solid fa-house"></i> Ke Dashboard
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }
        });
    </script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Shared Supabase Auth state synchronizer -->
    <script src="auth.js"></script>
    <!-- Mobile Menu Drawer Support -->
    <script src="mobile-menu.js"></script>
</body>
</html>
